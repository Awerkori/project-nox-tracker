name: Atualizar dados do tracker

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [issues-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar JSON dos Issues oficiais
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_issues.py

      - name: Verificar alterações nos dados
        id: check_diff
        run: |
          if git diff --quiet -- data/issues.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração detectada em data/issues.json."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Alterações detectadas em data/issues.json."
          fi

      - name: Publicar dados alterados no repositório
        if: steps.check_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issues.json
          git commit -m "chore: update tracker data"
          git pull --rebase origin main
          git push

      - name: Configurar GitHub Pages
        if: steps.check_diff.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Preparar arquivos estáticos para publicação
        if: steps.check_diff.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir _site
          cp index.html styles.css app.js particles.js favicon.ico _site/
          cp -R assets data _site/

      - name: Upload artefato Pages
        if: steps.check_diff.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        if: steps.check_diff.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
