name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/issues.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe e testes unitários
        run: |
          node --check app.js
          node --check particles.js
          python3 -m py_compile scripts/update_issues.py
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_tracker.py
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos
        run: |
          mkdir _site
          cp index.html styles.css app.js particles.js favicon.ico _site/
          cp -R assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
