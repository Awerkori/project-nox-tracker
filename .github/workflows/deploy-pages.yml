name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/issues.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe e testes unitários
        run: |
          node --check app.js
          node --check particles.js
          node --check duplicate-guard.js
          node --test tests/test_duplicate_guard_ui.mjs
          python3 -m py_compile scripts/update_issues.py
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_tracker.py
      - name: Executar testes E2E (Chromium e Firefox)
        run: |
          npm install --prefix /tmp/pw-runner --no-save playwright
          /tmp/pw-runner/node_modules/.bin/playwright install chromium firefox
          NODE_PATH=/tmp/pw-runner/node_modules node tests/e2e_comprehensive.mjs --no-screenshots
          NODE_PATH=/tmp/pw-runner/node_modules node tests/e2e_duplicate_guard.mjs --no-screenshots
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos
        run: |
          mkdir _site
          cp index.html styles.css app.js particles.js duplicate-guard.js favicon.ico _site/
          cp -R assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
